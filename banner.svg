<svg viewBox="0 0 1200 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
<title id="bannerTitle">Gustavo Firmino — Full Stack Developer</title>
<desc id="bannerDesc">Painel de trace mostrando o caminho completo de uma requisicao full stack: client em React e TanStack, api em NestJS, orm com Prisma e TypeORM e banco PostgreSQL.</desc>

<style>
  .mono { font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
  .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .bar  { transform-box: fill-box; transform-origin: left center; }

  @media (prefers-reduced-motion: no-preference) {
    .bar { transform: scaleX(0); animation: span .75s cubic-bezier(.2,.9,.3,1) forwards; }
    .s1 { animation-delay: .10s; }
    .s2 { animation-delay: .34s; }
    .s3 { animation-delay: .58s; }
    .s4 { animation-delay: .82s; }
  }
  @keyframes span { to { transform: scaleX(1); } }
</style>

